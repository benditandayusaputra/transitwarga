name = "transitwarga-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# ID namespace KV produksi (akun Cloudflare tim); wrangler dev tetap memakai
# storage lokal (miniflare).
kv_namespaces = [
  { binding = "SUMMARY_CACHE", id = "e9383cb926f44ea986ba133b80fa0493" },
  { binding = "QUOTA", id = "04df5c269bd44ce380c5d5b2dfd5f55f" }
]

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[dev]
port = 8787
